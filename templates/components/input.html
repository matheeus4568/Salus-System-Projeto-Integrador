
<div class="input-wrapper">
    {% if label %}
    <label class="input-label txt-md" for="">Label</label>
    {% endif %}

    <div class="input-container" style="width: {{ input_width|default:'' }};">
        {% if left_icon %}
            {% include 'components/clickable_icon.html' with icon=left_icon %}
        {% endif %}

        <input type="{{ input_type|default:'text' }}" class="custom-input txt-md" placeholder="{{ placeholder|default:'Digite a informação' }}" value="{{ value|default:'' }}" {{ properties }}>

        {% if right_icon %}
            {% include 'components/clickable_icon.html' with icon=right_icon %}
        {% endif %}
    </div>
</div>
