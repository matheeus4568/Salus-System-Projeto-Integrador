<!-- VARIÁVEIS INFO CARD -->
<!-- card_icon: nome do ícone a ser exibido -->
<!-- card_title: título do card -->
<!-- card_value: valor do card -->
<!-- bg_color: cor de fundo do card -->
<!-- fg_color: cor do texto do card -->
<!-- width: largura do card -->

<div class="info-card" style="background-color: {{ bg_color|default:'var(--light-gray)' }}; color: {{ fg_color|default:'var(--black)' }}; width: {{ width }};">
    {% if card_icon %}
        {% include 'components/icon.html' with icon=card_icon color=fg_color%}
    {% endif %}
    <div class="info-card-text">
        <p class="txt-xl">{{ card_title|default:"Untitled" }}</p>
        <p class="txt-xxl">{{ card_value|default_if_none:"None" }}</p>
    </div>
</div>
